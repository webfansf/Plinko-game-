<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLINKO – الصفحة الرسمية</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: #0845c9;
  color: #fff;
}

/* الحاوية */
.container {
  max-width: 720px;
  margin: auto;
  padding: 20px;
  position: relative;
  z-index: 2;
}

/* عنوان PLINKO */
.title {
  font-size: 70px;
  text-align: center;
  font-weight: 900;
  margin-top: 10px;
  animation: glow 1.6s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to { text-shadow: 0 0 25px #fff; }
}

/* خلفية الكرات */
.bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
}

.ball {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff7, #ff1a1a);
  filter: blur(10px);
}

.b1 { width: 120px; height: 120px; left: 12%; top: 10%; }
.b2 { width: 90px; height: 90px; left: 70%; top: 18%; }
.b3 { width: 110px; height: 110px; left: 40%; top: 50%; }
.b4 { width: 80px; height: 80px; left: 15%; top: 70%; }

/* عناوين */
.section-title {
  font-size: 26px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 10px;
}

/* عروض شبكية */
.grid-offers {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.offer {
  background: rgba(255,255,255,0.15);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  border: 1px solid rgba(255,255,255,0.3);
  backdrop-filter: blur(5px);
}

/* الفورم */
.form-box {
  background: rgba(255,255,255,0.20);
  padding: 20px;
  border-radius: 14px;
  backdrop-filter: blur(7px);
  margin-top: 25px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

.btn {
  width: 100%;
  background: #ff1a1a;
  color: #fff;
  padding: 14px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 800;
  margin-top: 15px;
  border: none;
  cursor: pointer;
}
</style>

</head>
<body>

<!-- خلفية الكرات -->
<div class="bg">
  <div class="ball b1"></div>
  <div class="ball b2"></div>
  <div class="ball b3"></div>
  <div class="ball b4"></div>
</div>

<div class="container">

  <h1 class="title">PLINKO</h1>

  <!-- عروض -->
  <h2 class="section-title">العروض المتاحة</h2>

  <div class="grid-offers">
    <div class="offer">عرض 1</div>
    <div class="offer">عرض 2</div>
    <div class="offer">عرض 3</div>
    <div class="offer">عرض 4</div>
    <div class="offer">عرض 5</div>
    <div class="offer">عرض 6</div>
  </div>

  <!-- نموذج الاشتراك -->
  <div class="form-box">
    <h2 class="section-title">تسجيل الاشتراك</h2>

    <label>الاسم</label>
    <input type="text" id="name">

    <label>رقم الهاتف</label>
    <input type="tel" id="phone">

    <label>اختيار العرض</label>
    <select id="plan">
      <option value="عرض 1">عرض 1</option>
      <option value="عرض 2">عرض 2</option>
      <option value="عرض 3">عرض 3</option>
      <option value="عرض 4">عرض 4</option>
      <option value="عرض 5">عرض 5</option>
      <option value="عرض 6">عرض 6</option>
    </select>

    <button class="btn" id="sendBtn">إرسال الطلب عبر Messenger</button>
  </div>

</div>

<script>
// رابط الماسنجر
const messenger = "https://m.me/587333667807395?source=qr_link_share";

document.getElementById("sendBtn").onclick = function () {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const plan = document.getElementById("plan").value;

  if (!phone) {
    alert("من فضلك أدخل رقم الهاتف");
    return;
  }

  const message =
    `طلب اشتراك%0A` +
    `الاسم: ${name || "-"}%0A` +
    `رقم الهاتف: ${phone}%0A` +
    `العرض المختار: ${plan}`;

  window.open(messenger + "&ref=" + message, "_blank");
};
</script>

</body>
</html>
