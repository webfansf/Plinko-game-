<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plinko</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#0a4cff, #0033aa);
        overflow-x: hidden;
        color: white;
        text-align: center;
    }

    /* كرات حمراء ضبابية */
    .ball {
        position: absolute;
        width: 80px;
        height: 80px;
        background: rgba(255, 0, 0, 0.4);
        border-radius: 50%;
        filter: blur(4px);
        animation: float 6s infinite linear;
    }

    @keyframes float {
        from { transform: translateY(0px); }
        to { transform: translateY(80px); }
    }

    /* كلمة PLINKO */
    .title {
        font-size: 60px;
        font-weight: bold;
        margin-top: 40px;
        animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px white; }
        to { text-shadow: 0 0 25px white; }
    }

    /* النص تحت كلمة بلاينكو */
    .sub-text {
        font-size: 18px;
        margin-top: -10px;
        margin-bottom: 30px;
    }

    /* قسم العروض */
    .offers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        width: 90%;
        margin: auto;
        margin-top: 20px;
    }

    .offer-box {
        background: rgba(255, 255, 255, 0.12);
        padding: 20px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: bold;
        backdrop-filter: blur(4px);
    }

    /* قسم آراء العملاء */
    .reviews {
        margin-top: 60px;
        padding: 20px;
        background: rgba(255,255,255,0.08);
        border-top: 2px solid rgba(255,255,255,0.2);
    }

    .review-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .review-box {
        background: rgba(255,255,255,0.12);
        padding: 15px;
        border-radius: 12px;
        text-align: right;
        margin-bottom: 12px;
        font-size: 16px;
        line-height: 1.7;
    }

</style>
</head>

<body>

<!-- كرات حمراء ضبابية -->
<div class="ball" style="top: 50px; left: 20px;"></div>
<div class="ball" style="top: 200px; left: 80%;"></div>
<div class="ball" style="top: 400px; left: 40%;"></div>

<!-- كلمة بلاينكو -->
<div class="title">PLINKO</div>

<!-- النص المطلوب تحت بلاينكو -->
<div class="sub-text">
    الموقع الرسمي — تقدر تشترك من خلاله بكل أمان وسهولة
</div>

<!-- قسم العروض (صفين) -->
<div class="offers">
    <div class="offer-box">عرض رقم 1</div>
    <div class="offer-box">عرض رقم 2</div>
    <div class="offer-box">عرض رقم 3</div>
    <div class="offer-box">عرض رقم 4</div>
</div>

<!-- قسم آراء العملاء -->
<div class="reviews">
    <div class="review-title">آراء العملاء</div>

    <!-- 50 تعليق Placeholder — شكل فقط -->
    <!-- تقدر تغيّر النصوص براحتك -->
    <script>
        const reviewTexts = [
            "التعامل محترم جداً – شكراً على الخدمة.",
            "الدعم الفني ممتاز وسريع.",
            "اشتراك سهل والخدمة واضحة.",
            "ناس محترمة بصراحة.",
            "تجربة ممتازة وأنصح بها.",
            "التعامل بسيط ومباشر.",
            "شكراً على المتابعة والاهتمام.",
            "خدمة سريعة وجودة عالية.",
            "أسلوب محترم جداً.",
            "تعامل راقي وذوق.",
        ];

        // توليد 50 تعليق لشكل الموقع فقط
        for (let i = 0; i < 50; i++) {
            const box = document.createElement("div");
            box.className = "review-box";
            box.innerText = reviewTexts[i % reviewTexts.length] + " — عميل من مصر";
            document.querySelector(".reviews").appendChild(box);
        }
    </script>

</div>

</body>
</html>
