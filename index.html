<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLINKO</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #003f7d;
  color: #fff;
  overflow-x: hidden;
}
.ball {
  position: absolute;
  width: 80px;
  height: 80px;
  background: rgba(255,0,0,0.4);
  border-radius: 50%;
  filter: blur(8px);
  animation: float 6s infinite ease-in-out;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-30px); }
  100% { transform: translateY(0px); }
}
.title {
  text-align: center;
  font-size: 55px;
  font-weight: 900;
  margin-top: 40px;
  color: #fff;
  animation: glow 2s infinite alternate ease-in-out;
}
@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to   { text-shadow: 0 0 25px #00c8ff; }
}
.sub-text {
  text-align: center;
  font-size: 18px;
  margin-top: -10px;
  color: #d8ecff;
}
.offers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  width: 90%;
  margin: 35px auto;
}
.offer-box {
  background: rgba(255,255,255,0.09);
  padding: 15px;
  text-align: center;
  border-radius: 14px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
  transition: 0.3s;
}
.offer-box:hover {
  transform: scale(1.05);
}
.form-section {
  width: 90%;
  margin: 20px auto;
  background: rgba(255,255,255,0.07);
  padding: 18px;
  border-radius: 14px;
  backdrop-filter: blur(6px);
}
.form-section input,
.form-section select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
}
.send-btn {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #00aaff;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
  color: #fff;
  cursor: pointer;
}
.reviews {
  width: 90%;
  margin: 35px auto;
}
.review-box {
  background: rgba(255,255,255,0.06);
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.07);
}
</style>
</head>
