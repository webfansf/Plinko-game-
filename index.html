<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Plinko</title>
<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: radial-gradient(circle, #0055ff, #003399);
    color: #fff;
    overflow-x: hidden;
}

/* كرات ضبابية */
.balls {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    overflow: hidden;
    z-index: -1;
}

.ball {
    position: absolute;
    width: 80px;
    height: 80px;
    background: red;
    border-radius: 50%;
    filter: blur(12px);
    opacity: 0.35;
    animation: float 6s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-40px); }
    100% { transform: translateY(0); }
}

/* عنوان PLINKO */
.title {
    text-align: center;
    font-size: 55px;
    font-weight: bold;
    margin-top: 30px;
    color: #fff;
    text-shadow: 0 0 15px #fff, 0 0 25px #00aaff;
    animation: glow 2s infinite alternate;
}
@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to   { text-shadow: 0 0 25px #00aaff; }
}

/* نص تحت العنوان */
.sub-text {
    text-align: center;
    margin-top: -10px;
    font-size: 16px;
    opacity: 0.9;
}

/* العروض */
.offers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 25px auto;
    width: 92%;
}

.offer-box {
    background: rgba(255,255,255,0.15);
    padding: 18px;
    border-radius: 14px;
    text-align: center;
    backdrop-filter: blur(6px);
    font-size: 20px;
    font-weight: bold;
}

.offer-box span {
    font-size: 14px;
    opacity: 0.85;
}

/* زر الاشتراك */
.join-btn {
    display: block;
    width: 85%;
    margin: 25px auto;
    background: #00aaff;
    color: #fff;
    padding: 14px;
    font-size: 20px;
    text-align: center;
    border-radius: 14px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 0 10px #00aaff;
}

/* التعليقات */
.reviews-section {
    width: 92%;
    margin: 35px auto;
}

.review-box {
    background: rgba(255,255,255,0.15);
    margin: 10px 0;
    padding: 12px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 15px;
    backdrop-filter: blur(4px);
}
</style>
</head>
<body>

<div class="balls">
    <div class="ball" style="top:20%; left:10%"></div>
    <div class="ball" style="top:60%; left:70%"></div>
    <div class="ball" style="top:40%; left:40%"></div>
</div>

<div class="title">PLINKO</div>
<div class="sub-text">الموقع الرسمي – تقدر تشترك من خلاله بكل أمان وسهولة</div>

<!-- العروض -->
<div class="offers">
    <div class="offer-box">عرض 200ج <br><span>قيمة تجريبية</span></div>
    <div class="offer-box">عرض 300ج <br><span>قيمة تجريبية</span></div>
    <div class="offer-box">عرض 500ج <br><span>قيمة تجريبية</span></div>
    <div class="offer-box">عرض 800ج <br><span>قيمة تجريبية</span></div>
    <div class="offer-box">عرض 1000ج <br><span>قيمة تجريبية</span></div>
    <div class="offer-box">عرض 2000ج <br><span>قيمة تجريبية</span></div>
</div>

<!-- زر الاشتراك -->
<a class="join-btn" href="https://m.me/587333667807395?source=qr_link_share">طلب الاشتراك</a>

<!-- التعليقات -->
<div class="reviews-section">
    <h3>آراء المستخدمين</h3>
    <div class="reviews"></div>
</div>

<script>
// تعليقات شكلية فقط
const names = [
    "محمد حسن","أحمد سمير","سارة أحمد","منة جمال","خالد أشرف","مريم حسن",
    "شريف علي","حسن يوسف","ياسمين محمد","هدى مصطفى","بلال يوسف","زياد وليد",
    "آية طارق","نوران محمود","إيمان فوزي","مي خالد","رحمة سمير"
];

const texts = [
    "التعامل محترم جداً.",
    "خدمة ممتازة ومريحة.",
    "سهل جداً ومباشر.",
    "شكراً على الاهتمام.",
    "تجربة لطيفة.",
    "سريعة وواضحة.",
    "أنصح بالتجربة.",
    "تعامل محترم."
];

// توليد 50 تعليق
for (let i = 0; i < 50; i++) {
    const box = document.createElement("div");
    box.className = "review-box";

    const n = names[Math.floor(Math.random()*names.length)];
    const t = texts[Math.floor(Math.random()*texts.length)];

    box.innerHTML = `<strong>${n}</strong><br>${t}`;
    document.querySelector(".reviews").appendChild(box);
}
</script>

</body>
</html>
