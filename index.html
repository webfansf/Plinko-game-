<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pilanko - عروض اشتراك</title>
  <style>
    :root{--blue1:#062a6b;--blue2:#0a3d91;--accent:#ff3b3b}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial; background: radial-gradient(ellipse at 10% 10%, rgba(10,61,145,0.12), transparent 20%), linear-gradient(180deg,var(--blue1),var(--blue2)); color:#fff;direction:rtl}
    header{padding:36px 20px;text-align:center;position:relative;overflow:hidden}/* PLINKO animated title */
.plinko-wrap{font-weight:800;letter-spacing:6px;font-size:110px;transform:translateY(0);display:inline-block;padding:8px 18px;border-radius:16px;background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));backdrop-filter:blur(6px)}
@keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}
.plinko-wrap{animation:floaty 3.6s ease-in-out infinite}

/* misty red balls */
.balls{position:absolute;inset:0;pointer-events:none}
.ball{position:absolute;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,100,100,0.95), rgba(255,10,10,0.7));filter:blur(6px) saturate(120%);opacity:0.9}

main{max-width:980px;margin:26px auto;padding:18px}
.card{background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.18));border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 6px 20px rgba(0,0,0,0.36)}

.lead{font-size:18px;margin:8px 0}
.note{font-size:13px;opacity:0.9;margin-top:8px}

/* testimonials */
.testimonials{display:flex;gap:10px;overflow:auto;padding:8px 4px}
.testi{min-width:220px;background:rgba(255,255,255,0.03);padding:12px;border-radius:10px}
.testi h4{margin:0 0 6px 0;font-size:16px}
.testi p{margin:0;font-size:14px;color:rgba(255,255,255,0.9)}

/* offers */
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.offer{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));padding:14px;border-radius:12px;text-align:center}
.offer .price{font-weight:800;font-size:20px;margin-bottom:6px}
.offer .payout{font-size:16px;margin-bottom:10px}
.offer button{background:var(--accent);border:0;padding:10px 14px;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}

/* form */
form{display:grid;grid-template-columns:1fr;gap:10px}
label{font-size:14px;text-align:right}
input,select{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff}
.submit{display:flex;gap:8px;align-items:center}
.submit button{flex:1;background:#07a86a;border:0;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}

footer{margin:20px;text-align:center;font-size:13px;opacity:0.9}

/* small screens */
@media (max-width:520px){.plinko-wrap{font-size:44px;padding:6px 12px}}

  </style>
</head>
<body>
  <header>
    <div class="plinko-wrap">PLINKO</div>
    <div class="balls" aria-hidden="true">
      <div class="ball" style="left:8%;top:8%;width:120px;height:120px;opacity:0.85"></div>
      <div class="ball" style="left:72%;top:6%;width:90px;height:90px;opacity:0.9"></div>
      <div class="ball" style="left:46%;top:22%;width:140px;height:140px;opacity:0.75"></div>
      <div class="ball" style="left:18%;top:34%;width:100px;height:100px;opacity:0.8"></div>
    </div>
  </header>  <main>
    <section class="card">$3تقديم طلب اشتراك$5</section><section class="card">$1شهادات عملائنا$2</section><footer class="card">
  <div style="font-weight:700;font-size:15px">تنبيه هام</div>
  <div style="margin-top:6px;font-size:13px;opacity:0.9;line-height:1.7">
    • جميع الاشتراكات تُعالَج عبر نظام خدمة العملاء لضمان الدقة والسرعة.<br>
    • يتم التواصل مع المشترك مباشرة عبر الماسنجر لتأكيد البيانات وطريقة الدفع.<br>
    • أي طلب غير مكتمل البيانات لن يتم مراجعته حتى يتم استيفاء المعلومات المطلوبة.
  </div>
</footer>

  </main>  <script>
    // تحريك كرات الخلفية بشكل بسيط
    const balls = document.querySelectorAll('.ball');
    balls.forEach((b,i)=>{
      const speed = 6 + i*2;
      b.animate([{transform:'translateY(0) rotate(0deg)'},{transform:'translateY(-12px) rotate(8deg)'},{transform:'translateY(0) rotate(0deg)'}],{duration:3000+ i*500,iterations:Infinity,easing:'ease-in-out'});
    });

    // ربط أزرار الاشتراك بتحديد الخطة في الفورم
    document.querySelectorAll('.offer button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const val = btn.getAttribute('data-amount');
        document.getElementById('plan').value = val;
        window.scrollTo({top:document.getElementById('signup').offsetTop - 30,behavior:'smooth'});
      });
    });

    // إرسال الطلب — إعادة توجيه للماسنجر مع البيانات
    document.getElementById('signup').addEventListener('submit', function(e){
      e.preventDefault();
      const name = this.name.value.trim();
      const mobile = this.mobile.value.trim();
      const plan = this.plan.value;

      if(!name || !mobile){
        showMsg('من فضلك اكمل الحقول المطلوبة');
        return;
      }

      // تكوين الرسالة
      const msg = `طلب اشتراك جديد:%0Aالاسم: ${name}%0Aالمحفظة: ${mobile}%0Aالخطة: ${plan} ج`; 

      // إعادة التوجيه للماسنجر
      window.location.href = "https://m.me/61576556411731?ref=" + msg;
    }();
    });

    function showMsg(txt){
      const el = document.getElementById('msg');
      el.textContent = txt;
      setTimeout(()=>el.textContent = '',6000);
    }
  </script></body>
</html>
