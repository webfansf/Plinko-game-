<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLINKO</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #003f7d;
  color: #fff;
  overflow-x: hidden;
}

/* كرات ضبابية */
.ball {
  position: absolute;
  width: 80px;
  height: 80px;
  background: rgba(255,0,0,0.4);
  border-radius: 50%;
  filter: blur(8px);
  animation: float 6s infinite ease-in-out;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-30px); }
  100% { transform: translateY(0px); }
}

/* كلمة PLINKO */
.title {
  text-align: center;
  font-size: 55px;
  font-weight: 900;
  margin-top: 40px;
  color: #fff;
  animation: glow 2s infinite alternate ease-in-out;
}
@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to   { text-shadow: 0 0 25px #00c8ff; }
}

/* النص تحت العنوان */
.sub-text {
  text-align: center;
  font-size: 18px;
  margin-top: -10px;
  color: #d8ecff;
}

/* العروض */
.offers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  width: 90%;
  margin: 35px auto;
}

.offer-box {
  background: rgba(255,255,255,0.09);
  padding: 15px;
  text-align: center;
  border-radius: 14px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
  transition: 0.3s;
}
.offer-box:hover {
  transform: scale(1.05);
}

/* نموذج طلب اشتراك */
.form-section {
  width: 90%;
  margin: 20px auto;
  background: rgba(255,255,255,0.07);
  padding: 18px;
  border-radius: 14px;
  backdrop-filter: blur(6px);
}

.form-section input,
.form-section select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
}

.send-btn {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #00aaff;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
  color: #fff;
  cursor: pointer;
}

/* التعليقات */
.reviews {
  width: 90%;
  margin: 35px auto;
}

.review-box {
  background: rgba(255,255,255,0.06);
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.07);
}

</style>
</head>
<body>

<!-- كرات ضبابية -->
<div class="ball" style="top:20%; left:10%;"></div>
<div class="ball" style="top:60%; left:70%;"></div>
<div class="ball" style="top:40%; left:30%;"></div>

<!-- العنوان -->
<h1 class="title">PLINKO</h1>
<p class="sub-text">الموقع الرسمي — تقدر تشترك من خلاله بكل أمان وسهولة</p>

<!-- العروض صفين -->
<div class="offers">
  <div class="offer-box">عرض 200 ج</div>
  <div class="offer-box">عرض 300 ج</div>
  <div class="offer-box">عرض 500 ج</div>
  <div class="offer-box">عرض 800 ج</div>
  <div class="offer-box">عرض 1000 ج</div>
  <div class="offer-box">عرض 2000 ج</div>
</div>

<!-- نموذج طلب اشتراك -->
<div class="form-section">
  <h3 style="text-align:center;margin-bottom:10px;">طلب اشتراك</h3>

  <label>الاسم</label>
  <input type="text" id="name" placeholder="اكتب اسمك">

  <label>رقم الهاتف</label>
  <input type="tel" id="phone" placeholder="01xxxxxxx">

  <label>اختار العرض</label>
  <select id="plan">
    <option>عرض 200 ج</option>
    <option>عرض 300 ج</option>
    <option>عرض 500 ج</option>
    <option>عرض 800 ج</option>
    <option>عرض 1000 ج</option>
    <option>عرض 2000 ج</option>
  </select>

  <button class="send-btn" onclick="sendMsg()">إرسال عبر Messenger</button>
</div>

<!-- التعليقات -->
<div class="reviews">
  <h3 style="margin-bottom:10px;">آراء العملاء</h3>

  <div id="reviewsContainer"></div>
</div>

<script>
const names = [
  "أحمد حسن","محمود أشرف","محمد صبري","يوسف إبراهيم","سيف علي",
  "خالد محمود","مصطفى حسين","عمرو رضا","مروان أحمد","عمر حاتم",
  "ياسمين وليد","آية خالد","منة أشرف","سارة سامي","رحمه محمد"
];

// توليد 30 تعليق شكل عام
let reviewsHTML = "";
for(let i=0;i<30;i++){
  const name = names[Math.floor(Math.random()*names.length)];
  reviewsHTML += `
    <div class="review-box">
      <strong>${name}</strong><br>
      تعامل محترم وسهل جدًا. تجربة ممتازة.
    </div>
  `;
}
document.getElementById("reviewsContainer").innerHTML = reviewsHTML;

// إرسال ماسنجر
function sendMsg(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const plan = document.getElementById("plan").value;

  if(!phone){
    alert("من فضلك أدخل رقم الهاتف");
    return;
  }

  const msg = `طلب اشتراك%0Aالاسم: ${name}%0Aالهاتف: ${phone}%0Aالعرض: ${plan}`;
  window.open("https://m.me/587333667807395?ref=" + msg, "_blank");
}
</script>

</body>
</html>
